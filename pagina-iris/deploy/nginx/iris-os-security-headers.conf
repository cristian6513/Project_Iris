# Cabeceras de seguridad de la página de IRIS OS.
#
# Se instala en /etc/nginx/snippets/ y se incluye en el server y en cada location
# que define sus propios add_header: nginx NO hereda add_header de niveles superiores
# cuando un bloque define alguno.
#
# scripts/preview.mjs lee este mismo archivo para servir la vista previa local con
# exactamente estas cabeceras. Si cambias algo aquí, pruébalo con la vista previa.
#
# CSP sin 'unsafe-inline': no hay scripts ni estilos en línea (lo verifica build.mjs).
# connect-src y form-action 'self' dejan listo el futuro backend en /api del mismo dominio.

add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), browsing-topics=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
