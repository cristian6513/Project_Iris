<!doctype html>
<html lang="es" class="no-js" data-theme="iris">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>App no encontrada · IRIS OS</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#020711">
    <meta name="color-scheme" content="dark">
    <!-- build.mjs añade aquí <base> para que los recursos carguen desde cualquier ruta -->
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="css/iris-site.css">
</head>
<body class="notfound-page">
    <div class="desktop">
        <div class="wall-host" aria-hidden="true"><div class="wallpaper"></div></div>
        <div class="shade" aria-hidden="true"></div>
        <div class="grain" aria-hidden="true"></div>

        <header class="topbar">
            <a class="brand" href="./" aria-label="IRIS OS, inicio">
                <span class="os-mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 4v10l-7 4-7-4V7l7-4z"/><path d="M12 8l3.5 2v4L12 16l-3.5-2v-4L12 8z"/><path d="M12 3v5m0 8v5"/></svg></span>
                <strong>IRIS OS</strong>
            </a>
        </header>

        <main class="home">
            <section class="notfound" aria-labelledby="nf-title">
                <header class="os-window-titlebar">
                    <div>
                        <span class="os-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></svg></span>
                        <h2>Error</h2>
                        <em>iris://404</em>
                    </div>
                </header>
                <div class="app">
                    <p class="code" aria-hidden="true">404</p>
                    <h1 class="app-title" id="nf-title">Esta app no existe.</h1>
                    <p class="lede">Puede que el enlace esté mal escrito o que la página se haya movido.</p>
                    <div class="window-actions">
                        <a class="btn primary" href="./">Volver al escritorio</a>
                        <a class="btn" href="./#que-es">Qué es IRIS</a>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
