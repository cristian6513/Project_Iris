<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>IRIS OS — imagen para compartir</title>
    <!-- Plantilla de la imagen Open Graph (1200×630). La renderiza scripts/render-images.mjs. -->
    <style>
        @font-face { font-family: 'Syne'; font-weight: 800; src: url('../fonts/syne-latin-800-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Outfit'; font-weight: 400; src: url('../fonts/outfit-latin-400-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Outfit'; font-weight: 600; src: url('../fonts/outfit-latin-600-normal.woff2') format('woff2'); }
        @font-face { font-family: 'JetBrains Mono'; font-weight: 600; src: url('../fonts/jetbrains-mono-latin-600-normal.woff2') format('woff2'); }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 1200px; height: 630px; overflow: hidden; background: #020711; }

        .card {
            position: relative;
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: url('../assets/wall-city.webp') center / cover no-repeat;
            color: #f8fdff;
            font-family: 'Outfit', sans-serif;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(0, 5, 13, 0.95), rgba(0, 5, 13, 0.72) 48%, rgba(0, 5, 13, 0.32) 78%, rgba(0, 5, 13, 0.6)),
                linear-gradient(180deg, rgba(0, 5, 13, 0.3), rgba(0, 5, 13, 0.1) 50%, rgba(0, 5, 13, 0.75)),
                radial-gradient(circle at 10% 14%, rgba(115, 247, 255, 0.2), transparent 38%),
                radial-gradient(circle at 82% 34%, rgba(255, 116, 212, 0.24), transparent 40%);
        }

        .content { position: absolute; left: 78px; top: 82px; width: 700px; }

        .kicker {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 10px 18px 10px 14px;
            border-radius: 999px;
            border: 1.5px solid rgba(115, 247, 255, 0.3);
            background: rgba(1, 7, 15, 0.55);
            font: 600 17px/1 'JetBrains Mono', monospace;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(220, 240, 248, 0.86);
        }

        .kicker i { width: 12px; height: 12px; border-radius: 50%; background: #5cffad; box-shadow: 0 0 16px #5cffad; }

        h1 {
            display: flex;
            gap: 0.16em;
            margin-top: 40px;
            font: 800 122px/0.84 'Syne', sans-serif;
            letter-spacing: -0.03em;
        }

        .iris {
            background: linear-gradient(100deg, #ffffff 18%, #b9fcff 58%, #ff74d4 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .os { color: transparent; -webkit-text-stroke: 2.5px #ffb6ea; }

        .lede { margin-top: 42px; font: 600 42px/1.18 'Outfit', sans-serif; }
        .sub { margin-top: 18px; font: 400 25px/1.35 'Outfit', sans-serif; color: rgba(220, 240, 248, 0.8); }

        .portrait {
            position: absolute;
            right: 104px;
            top: 146px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: url('../assets/profile-iris.webp') center / cover no-repeat;
            box-shadow: 0 0 0 3px rgba(115, 247, 255, 0.65), 0 0 90px rgba(255, 116, 212, 0.45);
        }

        .ring {
            position: absolute;
            right: 82px;
            top: 124px;
            width: 344px;
            height: 344px;
            border-radius: 50%;
            border: 2px solid rgba(255, 116, 212, 0.45);
        }

        .dock {
            position: absolute;
            right: 72px;
            bottom: 52px;
            display: flex;
            gap: 10px;
        }

        .dock span {
            padding: 10px 16px;
            border-radius: 12px;
            border: 1.5px solid rgba(115, 247, 255, 0.24);
            background: rgba(1, 7, 15, 0.7);
            font: 600 17px/1 'JetBrains Mono', monospace;
            letter-spacing: 0.06em;
            color: rgba(220, 240, 248, 0.9);
        }

        .dock span:nth-child(even) { border-color: rgba(255, 116, 212, 0.3); }
    </style>
</head>
<body>
    <div class="card">
        <div class="content">
            <span class="kicker"><i></i>Beta · impulsada por Hermes Agent</span>
            <h1><span class="iris">IRIS</span><span class="os">OS</span></h1>
            <p class="lede">Una IA que puedes ver, escuchar y hacer tuya.</p>
            <p class="sub">Voz, memoria, avatar y un escritorio propio.</p>
        </div>
        <div class="ring"></div>
        <div class="portrait"></div>
        <div class="dock"><span>Voz</span><span>Memoria</span><span>Avatar</span><span>Privacidad</span></div>
    </div>
</body>
</html>
