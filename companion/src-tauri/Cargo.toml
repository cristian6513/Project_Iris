[package]
name = "iris-desktop-companion"
version = "0.1.8"
description = "Optional floating desktop presence for IRIS OS"
authors = ["Project IRIS Contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "iris_desktop_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dirs = "6.0.0"
getrandom = "0.3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"
