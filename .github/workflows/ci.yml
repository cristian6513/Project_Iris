name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Linux audio runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libportaudio2

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Install Node.js for local web resources
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install locked web dependencies without lifecycle scripts
        run: npm --prefix companion ci --ignore-scripts

      - name: Build and verify local Face and Wizard resources
        run: node scripts/build_web.mjs --output artifacts/ci-web-assets --verify-contract scripts/release_web_assets.json

      - name: Run Python tests
        env:
          PYTHONUTF8: "1"
          IRIS_WEB_ASSETS_ROOT: ${{ github.workspace }}/artifacts/ci-web-assets
        run: uv run --no-sync pytest -q

      - name: Build source and wheel distributions
        if: runner.os == 'Linux'
        env:
          IRIS_WEB_ASSETS_ROOT: ${{ github.workspace }}/artifacts/ci-web-assets
        run: uv build

      - name: Verify distribution contents
        if: runner.os == 'Linux'
        run: uv run --no-sync python scripts/verify_distribution.py dist

  javascript:
    name: JavaScript and Companion web build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install locked Companion dependencies
        run: npm --prefix companion ci --ignore-scripts

      - name: Build and verify local Face and Wizard resources
        run: node scripts/build_web.mjs --output artifacts/ci-web-assets --verify-contract scripts/release_web_assets.json

      - name: Run JavaScript tests
        run: node --test tests/js/*.test.mjs

      - name: Build Companion web assets
        run: npm --prefix companion run build

  rust:
    name: Desktop and Companion native tests / Windows
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show pinned Rust toolchain
        run: rustc --version

      - name: Run Companion native tests
        run: cargo test --locked --manifest-path companion/src-tauri/Cargo.toml

      - name: Run Iris Desktop native tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
